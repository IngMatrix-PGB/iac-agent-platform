name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project (dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Reject attribution trailers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${BASE_SHA}..HEAD"
            printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
            python scripts/check_commit_attribution.py "$RUNNER_TEMP/pr-body.txt"
          else
            range="${BEFORE_SHA}..${AFTER_SHA}"
          fi
          git log --format=%B "$range" > "$RUNNER_TEMP/commit-messages.txt"
          python scripts/check_commit_attribution.py "$RUNNER_TEMP/commit-messages.txt"

      - name: Set up Terraform 1.16.1
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive -diff terraform/ tests/terraform/

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project (dev extras)
        run: pip install -e ".[dev,openai]"

      - name: Run deterministic offline suite
        run: pytest -m "not real_tool and not real_llm and not docker"

  tool-validation:
    name: Tool Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project (dev extras)
        run: pip install -e ".[dev]"

      - name: Set up Terraform 1.16.1
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Install Checkov 3.3.13
        run: pip install checkov==3.3.13

      - name: Run real-tool suite
        run: pytest -m real_tool

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install, test, and build the operator UI
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build
