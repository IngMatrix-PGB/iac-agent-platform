name: Real-tool setup
description: Install Python, Checkov, and Terraform, then restore the private provider cache.

inputs:
  pytest-args:
    description: Pytest command to run after the toolchain is installed
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          ci/requirements-checkov.txt

    - name: Install project (dev extras)
      shell: bash
      run: pip install -e ".[dev]"

    - name: Install Checkov 3.3.13
      shell: bash
      run: pip install -r ci/requirements-checkov.txt

    - name: Set up Terraform 1.16.1
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.16.1"
        terraform_wrapper: false

    - name: Restore Terraform provider cache
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/tf-plugin-cache
        key: tf-1.16.1-aws-6-${{ hashFiles('terraform/modules/**/versions.tf', 'bootstrap/aws-oidc/versions.tf') }}

    - name: Export the private Terraform plugin cache
      shell: bash
      run: |
        mkdir -p "${{ runner.temp }}/tf-plugin-cache"
        echo "TF_PLUGIN_CACHE_DIR=${{ runner.temp }}/tf-plugin-cache" >> "$GITHUB_ENV"

    - name: Run pytest
      shell: bash
      env:
        AWS_EC2_METADATA_DISABLED: "true"
      run: ${{ inputs.pytest-args }}
