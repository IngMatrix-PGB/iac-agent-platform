[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iac-agent-platform"
version = "0.1.0"
description = "Agentic Infrastructure-as-Code Platform — natural-language intent to safe, deterministic, reviewable Terraform changes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.6,<3",
    "langgraph>=1.2.11,<2",
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.32,<1",
]
openai = [
    "openai>=3.0,<4",
]
langfuse = [
    "langfuse>=4,<5",
]

[project.scripts]
iac-agent = "iac_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["iac_agent*", "evals*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_tool: exercises the real Terraform and/or Checkov binary (not a fake/mock) — classification only, does not affect default collection (Batch 16.5).",
    "real_llm: exercises a real natural-language-to-ArchitectureIntent model call (not a fake) — classification only, does not affect default collection; skipped whenever no provider is configured (Batch 21).",
    "real_bootstrap_tool: exercises the real Terraform binary against bootstrap/aws-oidc/, still fully credential-free (new-resource plan, no AWS auth) — classification only, does not affect default collection (Batch 25).",
    "real_aws_plan: exercises a real AWS API call via GitHub OIDC/STS-assumed credentials — classification only, does not affect default collection; human-gated, never run automatically (Batch 25).",
    "docker: requires a Docker daemon — excluded from the deterministic CI job (Batch 30).",
]
